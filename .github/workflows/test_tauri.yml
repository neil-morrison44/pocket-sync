name: "test-tauri-on-pr"
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tauri:
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdk-3.0 libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: install Rust target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: install app dependencies and build it
        run: npm ci && npm run build
      - name: test
        run: npm test

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.get_release.outputs.id }}
          args: --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-x86_64-unknown-linux-gnu
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
